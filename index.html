    <!-- Zero-FOUC Theme & Language Initialization Script (Allowlist Validated) -->
    <script>
      (function () {
        try {
          var allowedThemes = [
            'midnight-pro',
            'obsidian',
            'arctic-light',
            'ocean-breeze',
            'emerald-tech',
            'royal-violet'
          ];
          var root = document.documentElement;
          var savedLang = window.localStorage.getItem('bandr_solutions_lang');
          if (savedLang === 'ar' || savedLang === 'en') {
            root.lang = savedLang;
            root.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
          }

          var personalRaw = window.localStorage.getItem('bandr_personal_appearance_v1');
          var globalRaw = window.localStorage.getItem('bandr_global_appearance_cache_v1');
          var themeId = 'midnight-pro';
          var density = 'comfortable';
          var reducedMotion = false;

          if (personalRaw) {
            var p = JSON.parse(personalRaw);
            if (p && p.themeMode === 'system') {
              themeId = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'arctic-light'
                : 'midnight-pro';
            } else if (p && allowedThemes.indexOf(p.themeMode) !== -1) {
              themeId = p.themeMode;
            }
            if (p && (p.density === 'comfortable' || p.density === 'compact')) {
              density = p.density;
            }
            if (p && typeof p.reducedMotion === 'boolean') {
              reducedMotion = p.reducedMotion;
            }
          } else if (globalRaw) {
            var g = JSON.parse(globalRaw);
            if (g && allowedThemes.indexOf(g.themeId) !== -1) {
              themeId = g.themeId;
            }
            if (g && (g.density === 'comfortable' || g.density === 'compact')) {
              density = g.density;
            }
            if (g && typeof g.reducedMotion === 'boolean') {
              reducedMotion = g.reducedMotion;
            }
          }

          root.setAttribute('data-theme', themeId);
          root.setAttribute('data-theme-mode', themeId === 'arctic-light' ? 'light' : 'dark');
          root.setAttribute('data-density', density);
          root.setAttribute('data-reduced-motion', reducedMotion ? 'true' : 'false');
        } catch (e) {
          // Fallback safely to default attributes
        }
      })();
    </script>
